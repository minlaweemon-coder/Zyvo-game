<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYVO - Quick Tap</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  padding: 25px 20px;
  text-align: center;
  background: linear-gradient(180deg, #111827, #05070b);
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 6px;
  margin-top: 25px;
}

.subtitle {
  color: #9ca3af;
  margin-top: 8px;
  margin-bottom: 35px;
}

.card {
  background: #151b27;
  border: 1px solid #293244;
  border-radius: 24px;
  padding: 25px 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.timer {
  font-size: 58px;
  font-weight: bold;
  margin: 10px 0;
}

.score {
  font-size: 22px;
  color: #a5b4fc;
  margin-bottom: 25px;
}

.tap {
  width: 210px;
  height: 210px;
  border-radius: 50%;
  border: none;
  font-size: 30px;
  font-weight: bold;
  color: white;
  background: linear-gradient(145deg, #7c3aed, #2563eb);
  box-shadow: 0 15px 35px rgba(37,99,235,.35);
  cursor: pointer;
  transition: .08s;
  touch-action: manipulation;
}

.tap:active {
  transform: scale(.93);
}

.start {
  margin-top: 25px;
  padding: 15px 35px;
  border: none;
  border-radius: 14px;
  background: white;
  color: #111827;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  display: none;
  margin-top: 25px;
}

.result h2 {
  font-size: 30px;
  margin-bottom: 10px;
}

.best {
  color: #fbbf24;
  font-size: 18px;
}

@media (max-width: 360px) {
  .tap {
    width: 180px;
    height: 180px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="logo">ZYVO</div>
  <div class="subtitle">QUICK TAP CHALLENGE</div>

  <div class="card">

    <div class="timer" id="timer">10</div>

    <div class="score">
      SCORE: <span id="score">0</span>
    </div>

    <button class="tap" id="tapButton" disabled>
      TAP!
    </button>

    <br>

    <button class="start" id="startButton">
      START GAME
    </button>

    <div class="result" id="result">
      <h2>🔥 TIME UP!</h2>
      <p>Your Score</p>
      <h2 id="finalScore">0</h2>
      <p class="best">
        Best Score: <span id="bestScore">0</span>
      </p>
    </div>

  </div>

</div>

<script>
let score = 0;
let time = 10;
let playing = false;
let timerInterval;

const timer = document.getElementById("timer");
const scoreText = document.getElementById("score");
const tapButton = document.getElementById("tapButton");
const startButton = document.getElementById("startButton");
const result = document.getElementById("result");
const finalScore = document.getElementById("finalScore");
const bestScore = document.getElementById("bestScore");

let best = localStorage.getItem("zyvoBest") || 0;
bestScore.textContent = best;

startButton.addEventListener("click", startGame);

tapButton.addEventListener("click", () => {
  if (!playing) return;

  score++;
  scoreText.textContent = score;
});

function startGame() {

  score = 0;
  time = 10;
  playing = true;

  scoreText.textContent = "0";
  timer.textContent = "10";

  tapButton.disabled = false;
  startButton.style.display = "none";
  result.style.display = "none";

  timerInterval = setInterval(() => {

    time--;
    timer.textContent = time;

    if (time <= 0) {
      endGame();
    }

  }, 1000);
}

function endGame() {

  clearInterval(timerInterval);

  playing = false;
  tapButton.disabled = true;

  finalScore.textContent = score;

  if (score > best) {
    best = score;
    localStorage.setItem("zyvoBest", best);
  }

  bestScore.textContent = best;

  result.style.display = "block";
  startButton.textContent = "PLAY AGAIN";
  startButton.style.display = "inline-block";
}
</script>

</body>
</html>
